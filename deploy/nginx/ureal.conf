# ureal WebUI：静态前端 + /api 反代
#
# 由 docker-compose.yml 的 nginx 服务挂载到 /etc/nginx/conf.d/default.conf。
# 两个容器都在 host 网络，故后端地址直接写 127.0.0.1:8080。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/file 的上传、下载可能较大
    client_max_body_size 20m;

    # 静态资源压缩（SSE 所在的 /api 下单独关闭）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 后端 API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # /api/chat 与 /api/events 是 SSE 长连接，必须关闭缓冲与压缩
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 静态资源 ──────────────────────────────────────────────
    # vite 产物带内容哈希，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，避免发版后浏览器拿旧壳子去加载已删除的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

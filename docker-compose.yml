# ureal SmartHome Agent 生产编排（后端 agent + 前端 nginx，同机 host 网络）
#
# 启动：
#   docker compose up -d --build      # 首次 / 依赖变更
#   ./deploy/docker-up.sh             # 等价一键脚本
#
# 说明：
# - 两个服务都用 network_mode: host，因此 nginx 的 proxy_pass 可以直接写
#   127.0.0.1:8080，agent 也能直连 config/mcporter.json 里的 127.0.0.1:8123（Home Assistant）；
# - 端口全部落在宿主机上：80/443 归 nginx，8080 归 agent。
#   8080 无任何鉴权，务必用防火墙拦住（见 README「Docker 部署 → 安全」）；
# - 只支持 1 个 agent 实例：CoreAgent 的会话锁在进程内，多副本会并发写同一份
#   sessions/*.json，飞书 / 微信长连接也会重复回复。

services:
  agent:
    build: .
    image: ureal-agent:latest
    container_name: ureal-agent
    restart: unless-stopped
    init: true                  # 与镜像内 tini 二选一即可，共存无害
    network_mode: host          # 同机部署：nginx 反代 127.0.0.1:8080
    platform: linux/arm64       # RK3528；在 x86 上构建时删掉此行
    volumes:
      - ./config:/app/config          # 必须可写：WebUI 会回写 agent.yaml / cron.yaml
      - ./memory:/app/memory          # 长期记忆
      - ./sessions:/app/sessions      # 会话历史
      - ./workspace:/app/workspace    # Agent 产出沙箱
      - ./data:/app/data              # 节假日缓存
      - ./.env:/app/.env              # 单文件挂载：/api/env 会改写它
      - ./.openclaw:/app/.openclaw    # 微信扫码登录态
      # ── 源码只读挂载：改后端代码后 docker compose restart 即可，免 rebuild ──
      # 依赖（package.json / pnpm-lock.yaml）变化时仍必须 build
      - ./src:/app/src:ro
      - ./plugin:/app/plugin:ro
      - ./skills:/app/skills:ro
      - ./README.md:/app/README.md:ro
    # user: "1000:1000"             # 宿主机普通用户跑时再打开
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: ureal-nginx
    restart: unless-stopped
    network_mode: host          # 必须：否则 proxy_pass 的 127.0.0.1:8080 指向 nginx 自己
    depends_on:
      agent:
        condition: service_healthy   # 等 /api/health 通过再起，避免首屏 502
    volumes:
      - ./deploy/nginx/ureal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webui/dist:/usr/share/nginx/html:ro       # 前端产物：本地 npm run build 后同步上来
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro  # 启用 HTTPS 时再打开
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
